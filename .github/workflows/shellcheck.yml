name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every file with a bash/sh shebang (bin/agent has no .sh extension).
      # Run the same check locally:
      #   docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 -x <files>
      - name: Run shellcheck
        run: |
          mapfile -t files < <(git ls-files | xargs grep -lIE '^#!.*\b(bash|sh)\b' | sort)
          printf '%s\n' "${files[@]}"
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 -x "${files[@]}"
